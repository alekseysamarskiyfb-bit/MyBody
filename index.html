 if(!nq)h+='<p class="hint">Всего продуктов: '+l.length+'. Введи название в поиск.</p>';
 h+=l.slice(0,40).map(function(x){var f=x.f;return'<button class="fr" data-act="fpick" data-p="'+x.id+'"><b>'+esc(f.n)+'</b><em>'+Math.round(f.k)+' ккал · Б '+n1(f.p)+' · Ж '+n1(f.f)+' · У '+n1(f.c)+' на 100 г</em></button>'}).join('');
 if(l.length>40)h+='<p class="hint">Показаны первые 40. Уточни поиск.</p>';
 return h}
function foodHtml(){return'<div class="bd" data-act="close"></div><div class="sh tall"><div class="grab"></div><h3>Добавить продукт</h3><input id="fq" placeholder="Поиск, например: гречка" autocomplete="off"><div id="fres">'+fres('')+'</div></div>'}
function qtyHtml(){var f=foodOf(sh.pid),g=sh.g||100;return'<div class="bd" data-act="close"></div><div class="sh tall"><div class="grab"></div><h3>'+esc(f.n)+'</h3><p class="hint">На 100 г: '+Math.round(f.k)+' ккал · Б '+n1(f.p)+' · Ж '+n1(f.f)+' · У '+n1(f.c)+'</p><label for="fg">Количество, г</label><div class="rep"><button class="rb" data-act="gstep" data-d="-1" aria-label="Меньше">−</button><input id="fg" inputmode="numeric" value="'+g+'"><button class="rb" data-act="gstep" data-d="1" aria-label="Больше">+</button></div><div class="chips">'+[50,100,150,200,250].map(function(x){return'<button data-act="gchip" data-g="'+x+'">'+x+' г</button>'}).join('')+'</div><div class="pv" id="fpv">'+pvHtml(f,g)+'</div><div class="acts"><button class="btn pri" data-act="'+(sh.iid?'isave':'fadd')+'">'+(sh.iid?'Готово':'Добавить')+'</button>'+(sh.iid?'<button class="del" data-act="idel">Удалить продукт</button>':'<button class="del" style="color:var(--mute)" data-act="fback">Назад к поиску</button>')+'</div></div>'}
function newFoodHtml(){return'<div class="bd" data-act="close"></div><div class="sh tall"><div class="grab"></div><h3>Свой продукт</h3><p class="hint">Значения на 100 г</p><label for="fn" style="margin-top:6px">Название</label><input id="fn" autocomplete="off"><div class="g2"><div><label for="fk">Ккал</label><input id="fk" inputmode="decimal"></div><div><label for="fp">Белки, г</label><input id="fp" inputmode="decimal"></div><div><label for="ff">Жиры, г</label><input id="ff" inputmode="decimal"></div><div><label for="fc">Углеводы, г</label><input id="fc" inputmode="decimal"></div></div><label for="fb2">Клетчатка, г</label><input id="fb2" inputmode="decimal"><div class="acts"><button class="btn pri" data-act="fsave">Сохранить</button><button class="del" style="color:var(--mute)" data-act="fback">Назад к поиску</button></div></div>'}
function mealHtml(){var m=meal(sh.m);return'<div class="bd" data-act="close"></div><div class="sh"><div class="grab"></div><label for="mn" style="margin-top:0">Название приёма пищи</label><input id="mn" value="'+esc(m.n)+'" autocomplete="off"><div class="mv"><button class="wb" data-act="mup">↑ Выше</button><button class="wb" data-act="mdn">↓ Ниже</button></div><div class="acts"><button class="btn pri" data-act="msave">Готово</button><button class="del" data-act="mdel">Удалить приём пищи</button></div></div>'}
function newMealHtml(){var ms=S.nut[day];return'<div class="bd" data-act="close"></div><div class="sh"><div class="grab"></div><label for="mn" style="margin-top:0">Название</label><input id="mn" placeholder="Например, перекус" autocomplete="off"><div class="chips">'+['Завтрак','Перекус','Обед','Полдник','Ужин','Перед сном'].map(function(n){return'<button data-act="mchip" data-n="'+n+'">'+n+'</button>'}).join('')+'</div><label for="mpos">Где поставить</label><select id="mpos"><option value="0">В начало</option>'+ms.map(function(m,i){return'<option value="'+(i+1)+'"'+(i===ms.length-1?' selected':'')+'>После: '+esc(m.n)+'</option>'}).join('')+'</select><div class="acts"><button class="btn pri" data-act="nmadd">Добавить</button></div></div>'}
function render(){
 var cm=curMod(),td=todayDay(),pl=S.plan[day],p=PR(day),h='',mon=monday(today());
 document.getElementById('nav').innerHTML=[['w','Тренировка'],['n','Питание']].map(function(t){return'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
 document.getElementById('gear').className='gear'+(tab==='s'?' on':'');
 document.getElementById('days').innerHTML=DAYS.map(function(n,i){return'<button data-d="'+i+'" class="'+(i===day?'on ':'')+(i===td?'now ':'')+(S.plan[i].on?'':'rest ')+(dayDone(i)?'done':'')+'"><small>'+n+'</small><b>'+(dayDone(i)?DB_ICON:new Date((mon+i)*864e5).getUTCDate())+'</b></button>'}).join('');
 if(tab==='w'){
  var ons=[0,1,2,3,4,5,6].filter(function(i){return S.plan[i].on});
  h+='<div class="ttl"><span>'+DAYF[day]+'</span>'+(pl.on?WN[cm]+' неделя':'День отдыха')+'</div>';
  h+='<button class="chip" data-act="wk">'+[0,1,2].map(function(i){return'<i class="'+(i===cm?'on':'')+'"></i>'}).join('')+'<em>Неделя '+(cm+1)+' из 3 ▾</em></button>';
  if(ons.length&&ons.every(dayDone))h+='<div class="nxt"><b>Неделя выполнена</b><button class="btn pri" data-act="nextw">Перейти: '+WN[(cm+1)%3].toLowerCase()+' неделя</button></div>';
  if(pl.on)h+=blk('am','Утро',pl,p,cm)+blk('pm','Вечер',pl,p,cm);
  else if(pl.am.length)h+=blk('am','Растяжка',pl,p,cm);
  else h+='<div class="empty" style="margin-top:24px">Сегодня отдых. Чтобы добавить растяжку, открой настройки (шестерёнка).</div>';
 }else if(tab==='n'){
  h+=nutScreen();
 }else{
  h+='<div class="ttl"><span>Настройки</span>'+DAYF[day]+'</div>';
  h+='<h2>Тренировки</h2><div class="stp" style="margin-top:0">Тренировочный день<button class="sw'+(pl.on?' on':'')+'" data-act="onoff" aria-label="Тренировочный день"></button></div>';
  h+='<p style="color:var(--mute);margin:12px 0 0;font-size:15px">'+(pl.on?'День выбирается лентой сверху. Выбери неделю и нажми на упражнение, чтобы изменить повторы.':'В день отдыха можно оставить только необязательную растяжку.')+'</p>';
  h+='<div class="seg">'+WN.map(function(n,i){return'<button data-w="'+i+'" class="'+(i===ew?'on':'')+'">'+n+'</button>'}).join('')+'</div>';
  (pl.on?[['am','Утро'],['pm','Вечер']]:[['am','Растяжка']]).forEach(function(b){h+='<h2>'+b[1]+'</h2>'+stp(b[0])+list(b[0],pl[b[0]],ew,{},'p')+'<button class="add" data-act="add" data-b="'+b[0]+'">+ Добавить упражнение</button>'});
  var g=S.goals;
  h+='<h2>Питание, норма в день</h2>'+gst('k','Калории',g.k+' ккал')+gst('p','Белки',g.p+' г')+gst('f','Жиры',g.f+' г')+gst('c','Углеводы',g.c+' г')+gst('fb','Клетчатка',g.fb+' г');
  h+='<h2>Вода</h2>'+wst('goal','Норма в день',fL(S.water.goal))+wst('bottle','Порция 1',S.water.bottle+' мл')+wst('glass','Порция 2',S.water.glass+' мл');
  h+='<button class="lnk" data-act="clear">Сбросить прогресс этого дня</button>';
 }
 document.getElementById('app').innerHTML=h;
 if(fx==='fin')confetti();
 var lv=document.querySelector('.lv');if(lv){var tp=+lv.dataset.p;requestAnimationFrame(function(){requestAnimationFrame(function(){lv.style.width=tp+'%';lv.classList.toggle('z',!tp)})})}if(tab==='n'&&wnext)wprev=wnext;
 fillAnim();
 fx=null;pop=null}
function openWeeks(){sh={wk:1};var cm=curMod(),el=document.getElementById('sheet');
 el.innerHTML='<div class="bd" data-act="close"></div><div class="sh"><div class="grab"></div><h3>Неделя цикла</h3><p class="hint">Неделя меняется сама каждый понедельник. Если выбрать другую вручную, она начнётся заново.</p>'+WN.map(function(n,i){return'<button class="wrow'+(i===cm?' cur':'')+'" data-act="'+(i===cm?'close':'pickw')+'" data-k="'+i+'"><span>'+n+'</span><em>'+(i===cm?'Сейчас':'Выбрать')+'</em></button>'}).join('')+'</div>';
 requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('open')})})}
function confetti(){var c=document.querySelector('.fin.anim .conf');if(!c)return;var col=['var(--on)','#fff','rgba(0,0,0,.35)'],h='';
 for(var i=0;i<28;i++){var a=Math.random()*Math.PI*2,d=70+Math.random()*100;h+='<i style="background:'+col[i%3]+';--x:'+Math.round(Math.cos(a)*d)+'px;--y:'+Math.round(Math.sin(a)*d-20)+'px;--r:'+Math.round(Math.random()*540)+'deg;animation-delay:'+(0.7+Math.random()*.15).toFixed(2)+'s"></i>'}
 c.innerHTML=h}
function openSheet(b,id){
 sh={b:b,id:id,t:'r'};var e=id?S.plan[day][b].filter(function(x){return x.id===id})[0]:null,el=document.getElementById('sheet');if(e&&e.t)sh.t=e.t;var T=sh.t==='t';
 el.innerHTML='<div class="bd" data-act="close"></div><div class="sh"><div class="grab"></div><label for="sn" style="margin-top:0">Название</label><input id="sn" value="'+esc(e?e.n:'')+'" placeholder="Например, приседания" autocomplete="off"><div class="seg"><button data-act="typ" data-v="r" class="'+(T?'':'on')+'">Повторы</button><button data-act="typ" data-v="t" class="'+(T?'on':'')+'">Время</button></div><label for="sr" id="sl">'+(T?'Время':'Повторы')+', '+WN[ew].toLowerCase()+' неделя</label><div class="rep"><button class="rb" data-act="step" data-d="-1" aria-label="Меньше">−</button><input id="sr" value="'+esc(e?e.s[ew]:'10')+'" aria-label="Значение"><button class="rb" data-act="step" data-d="1" aria-label="Больше">+</button></div><div class="acts"><button class="btn pri" data-act="save">'+(e?'Готово':'Добавить')+'</button>'+(e?'<button class="del" data-act="del">Удалить упражнение</button>':'')+'</div></div>';
 requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('open')})})}
function closeSheet(){sh=null;var el=document.getElementById('sheet');el.classList.remove('open');setTimeout(function(){if(!sh)el.innerHTML=''},400)}
function onClick(ev){
 var t=ev.target.closest('button,.bd');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;fx='enter';render();return}
 if(t.dataset.d!==undefined&&!t.dataset.act){day=+t.dataset.d;fx='enter';render();return}
 if(t.dataset.w!==undefined){ew=+t.dataset.w;render();return}
 var a=t.dataset.act;if(!a)return;var p=PR(day),pl=S.plan[day];
 if(a==='tick'){var m=t.dataset.b==='am'?p.am:p.c,id=t.dataset.id;if(m[id])delete m[id];else{m[id]=1;pop=id}save();render()}
 else if(a==='next'){var bb=t.dataset.b,am=bb==='am',N=rounds(day,curMod(),bb),r=(am?p.ar:p.r)|0;if(r>=N-1){if(am)p.afin=true;else p.fin=true;fx='fin';finB=bb}else{if(am){p.ar=r+1;p.am={}}else{p.r=r+1;p.c={}}fx='swap'}save();render()}
 else if(a==='edit')openSheet(t.dataset.b,t.dataset.id);
 else if(a==='add')openSheet(t.dataset.b,null);
 else if(a==='close')closeSheet();
 else if(a==='typ'){var v2=t.dataset.v;if(sh.t!==v2){sh.t=v2;document.getElementById('sr').value=v2==='t'?'30 с':'10';document.getElementById('sl').textContent=(v2==='t'?'Время':'Повторы')+', '+WN[ew].toLowerCase()+' неделя';t.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===t)})}}
 else if(a==='step'){var i=document.getElementById('sr');if(sh.t==='t'){i.value=fmtT(Math.max(5,parseT(i.value)+5*(+t.dataset.d)))}else{var m2=/^(\d+)(.*)$/.exec(i.value.trim());if(m2){i.value=Math.max(1,+m2[1]+(+t.dataset.d))+m2[2]}}}
 else if(a==='save'){var nm=document.getElementById('sn').value.trim(),rp=document.getElementById('sr').value.trim()||'10';if(sh.t==='t')rp=fmtT(parseT(rp)||30);if(!nm){document.getElementById('sn').focus();return}
  if(sh.id){var e=pl[sh.b].filter(function(x){return x.id===sh.id})[0];e.n=nm;if(e.t!==sh.t)e.s=[rp,rp,rp];e.t=sh.t;e.s[ew]=rp}else{var n=ex(nm,rp,rp,rp,sh.t);pl[sh.b].push(n)}
  save();closeSheet();render()}
 else if(a==='del'){pl[sh.b]=pl[sh.b].filter(function(x){return x.id!==sh.id});save();closeSheet();render()}
 else if(a==='rstep'){var rb=t.dataset.b,v=Math.min(9,Math.max(1,rounds(day,ew,rb)+(+t.dataset.d)));pl[rb==='am'?'ra':'rounds'][ew]=String(v);save();render()}
 else if(a==='wk')openWeeks();
 else if(a==='pickw'){setWeek(+t.dataset.k);closeSheet();fx='enter';render()}
 else if(a==='nextw'){setWeek((curMod()+1)%3);fx='enter';render()}
 else if(a==='wadd'){var wk=monday(today())+day,wl=S.wlog[wk]||(S.wlog[wk]=[]);var ad=S.water[t.dataset.v],tb=wl.reduce(function(x,y){return x+y},0);wl.push(ad);if(tb<S.water.goal&&tb+ad>=S.water.goal){fx='fin';finB='water'}save();render()}
 else if(a==='wundo'){var wl2=S.wlog[monday(today())+day];if(wl2&&wl2.length){wl2.pop();save();render()}}
 else if(a==='wset'){var ws={goal:[250,500,6000],bottle:[50,100,2000],glass:[50,50,1000]}[t.dataset.k];S.water[t.dataset.k]=Math.min(ws[2],Math.max(ws[1],S.water[t.dataset.k]+ws[0]*(+t.dataset.d)));save();render()}
 else if(a==='newmeal'){sh={k:'newmeal'};showSheet(newMealHtml())}
 else if(a==='mchip'){document.getElementById('mn').value=t.dataset.n}
 else if(a==='nmadd'){var nm2=document.getElementById('mn').value.trim();if(!nm2){document.getElementById('mn').focus();return}S.nut[day].splice(+document.getElementById('mpos').value,0,{id:uid(),n:nm2,items:[]});save();closeSheet();render()}
 else if(a==='meal'){sh={k:'meal',m:t.dataset.m};showSheet(mealHtml())}
 else if(a==='mup'||a==='mdn'){var mm=meal(sh.m),arr=S.nut[day],ix=arr.indexOf(mm),nj=a==='mup'?ix-1:ix+1,nn=document.getElementById('mn').value.trim();if(nn)mm.n=nn;if(nj>=0&&nj<arr.length){arr.splice(ix,1);arr.splice(nj,0,mm)}save();render()}
 else if(a==='msave'){var m3=meal(sh.m),n3=document.getElementById('mn').value.trim();if(n3)m3.n=n3;save();closeSheet();render()}
 else if(a==='mdel'){S.nut[day]=S.nut[day].filter(function(m){return m.id!==sh.m});save();closeSheet();render()}
 else if(a==='food'){sh={k:'food',m:t.dataset.m,st:'list'};showSheet(foodHtml())}
 else if(a==='fpick'){sh.pid=t.dataset.p;sh.st='qty';sh.g=100;sh.iid=null;showSheet(qtyHtml())}
 else if(a==='fnew'){sh.st='new';showSheet(newFoodHtml())}
 else if(a==='fback'){sh.st='list';showSheet(foodHtml())}
 else if(a==='fsave'){var fn=document.getElementById('fn').value.trim();if(!fn){document.getElementById('fn').focus();return}var nu=function(id){return parseFloat(String(document.getElementById(id).value).replace(',','.'))||0},nf={id:'c'+uid(),n:fn,k:nu('fk'),p:nu('fp'),f:nu('ff'),c:nu('fc'),fb:nu('fb2')};S.foods.push(nf);save();sh.pid=nf.id;sh.st='qty';sh.g=100;sh.iid=null;showSheet(qtyHtml())}
 else if(a==='item'){var mi=meal(t.dataset.m),it=mi.items.filter(function(x){return x.id===t.dataset.id})[0];sh={k:'food',m:mi.id,st:'qty',pid:it.pid,iid:it.id,g:it.g};showSheet(qtyHtml())}
 else if(a==='gstep'){var gi=document.getElementById('fg');gi.value=Math.max(5,(parseFloat(gi.value)||0)+10*(+t.dataset.d));updPv()}
 else if(a==='gchip'){document.getElementById('fg').value=t.dataset.g;updPv()}
 else if(a==='fadd'){var gv=Math.max(1,Math.round(parseFloat(document.getElementById('fg').value)||0));meal(sh.m).items.push({id:uid(),pid:sh.pid,g:gv});save();closeSheet();render()}
 else if(a==='isave'){var gv2=Math.max(1,Math.round(parseFloat(document.getElementById('fg').value)||0));meal(sh.m).items.filter(function(x){return x.id===sh.iid})[0].g=gv2;save();closeSheet();render()}
 else if(a==='idel'){var m4=meal(sh.m);m4.items=m4.items.filter(function(x){return x.id!==sh.iid});save();closeSheet();render()}
 else if(a==='gset'){var gb={k:[50,800,6000],p:[5,20,400],f:[5,10,300],c:[5,20,800],fb:[1,5,100]}[t.dataset.k];S.goals[t.dataset.k]=Math.min(gb[2],Math.max(gb[1],S.goals[t.dataset.k]+gb[0]*(+t.dataset.d)));save();render()}
 else if(a==='onoff')
{pl.on=!pl.on;save();render()}
 else if(a==='clear'){delete S.prog[key(day)];save();render()}
}
var heldFlag=false,hold=null;
document.addEventListener('click',function(ev){if(heldFlag){heldFlag=false;return}onClick(ev)});
document.addEventListener('pointerdown',function(ev){var b=ev.target.closest&&ev.target.closest('button');if(!b||!/^(step|rstep|wset|gset|gstep)$/.test(b.dataset.act||''))return;heldFlag=false;stopHold();var h={};hold=h;h.to=setTimeout(function(){heldFlag=true;h.iv=setInterval(function(){onClick({target:{closest:function(){return b}}})},110)},420)});
function stopHold(){if(hold){clearTimeout(hold.to);clearInterval(hold.iv);hold=null;if(heldFlag)setTimeout(function(){heldFlag=false},80)}}
document.addEventListener('pointerup',stopHold);document.addEventListener('pointercancel',stopHold);
document.addEventListener('contextmenu',function(ev){if(ev.target.closest&&ev.target.closest('button'))ev.preventDefault()});
document.addEventListener('input',function(ev){var i=ev.target;if(i.id==='fq')document.getElementById('fres').innerHTML=fres(i.value);else if(i.id==='fg')updPv()});
var lastD=today();
function tick(){var n=today();if(n!==lastD){lastD=n;day=todayDay();ew=curMod();fx='enter';render()}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
window.addEventListener('focus',tick);window.addEventListener('pageshow',tick);setInterval(tick,60000);
save();render();
</script>
